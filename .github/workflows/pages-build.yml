name: Build Pages artifact

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Complete React publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Download pinned frontend snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: pokelitee/rom-wiki
        run: |
          archive="$(python -c 'import json; print(json.load(open("sites/frontend-snapshot/manifest.json"))["archive"])')"
          gh release download snapshots --pattern "$archive" --dir sites/frontend-snapshot
      - name: Restore and verify complete publication
        env:
          PYTHONPATH: src
        run: |
          python -m romwiki site restore-web sites/frontend-snapshot
          python scripts/check_frontend_publication.py
      - name: Download pinned PokéDB packs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: pokelitee/rom-wiki
        run: |
          archive="$(python -c 'import json; print(json.load(open("sites/generator-runtime/manifest.json"))["archive"])')"
          gh release download snapshots --pattern "$archive" --dir sites/generator-runtime
      - name: Bundle the browser generator
        env:
          PYTHONPATH: src
        run: |
          python -m pip wheel . --no-deps --wheel-dir .romwiki/wheel
          python -m romwiki site restore-pokedb sites/generator-runtime --output .romwiki/pokedb-packs
          python -m romwiki site bundle-generator --wheel .romwiki/wheel/*.whl --packs .romwiki/pokedb-packs --output web/public/generator
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: web
        run: npm ci
      - name: Build application
        working-directory: web
        run: npm run build
      - name: Install browser
        working-directory: web
        run: npx playwright install --with-deps chromium
      - name: Test all published games on desktop and mobile
        working-directory: web
        run: npm run test:e2e -- --workers=2
      - name: Upload verified Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: web/dist
