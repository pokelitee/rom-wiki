name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen:
    name: Publishing frozen during React migration
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep the last published site available
        run: |
          echo "Publishing is frozen during the React migration. Validate the complete frontend snapshot and obtain cutover authorization before restoring deployment."
          exit 1
