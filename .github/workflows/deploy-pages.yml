name: Deploy Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "sites/**"
      - "profiles/**"
      - "requirements/**"
      - "pyproject.toml"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
      sites: ${{ steps.sites.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install test and documentation dependencies
        run: |
          python -m pip install -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Run tests
        run: python -m pytest -q

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Resolve published site matrix
        id: sites
        run: echo "matrix=$(romwiki site list --published --json)" >> "$GITHUB_OUTPUT"

  build:
    timeout-minutes: 20
    name: Build ${{ matrix.site.id }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        site: ${{ fromJSON(needs.prepare.outputs.sites) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install -r requirements/docs.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Restore generated wiki pages
        if: matrix.site.data_driven
        run: romwiki site restore-snapshot --site "${{ matrix.site.id }}"

      - name: Resolve site build fingerprint
        id: fingerprint
        run: echo "value=$(romwiki site fingerprint '${{ matrix.site.id }}' --output dist)" >> "$GITHUB_OUTPUT"
        env:
          ROMWIKI_SITE_URL: ${{ needs.prepare.outputs.base_url }}

      - name: Restore reusable site artifact
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            dist
            .romwiki/build-state
          key: site-${{ runner.os }}-${{ matrix.site.id }}-${{ steps.fingerprint.outputs.value }}

      - name: Build site
        run: romwiki site build "${{ matrix.site.id }}" --output dist --reuse-unchanged
        env:
          ROMWIKI_SITE_URL: ${{ needs.prepare.outputs.base_url }}

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ matrix.site.id }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    timeout-minutes: 15
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install package
        run: |
          python -m pip install -r requirements/docs.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Assemble site artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: site-*
          path: dist
          merge-multiple: true

      - name: Restore audit parse cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .romwiki/audit-cache.sqlite3
          key: audit-v1-${{ github.sha }}
          restore-keys: audit-v1-

      - name: Audit rendered sites
        run: romwiki site audit dist --base-url "${{ needs.prepare.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
