name: Deploy wikis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and documentation dependencies
        run: python -m pip install ".[dev,docs]"

      - name: Run tests
        run: python -m pytest -q

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Restore generated wiki pages
        run: romwiki site restore-snapshot

      - name: Build published sites
        run: romwiki site build --all --output dist
        env:
          ROMWIKI_SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Audit rendered sites
        run: romwiki site audit dist --base-url "${{ steps.pages.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
