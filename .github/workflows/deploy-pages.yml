name: Deploy Pages

# Deploys only main commits that CI already validated. Rulesets block direct
# pushes, so every main commit is a single PR merge whose first parent is the
# previous main commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
      || (github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main')
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
      deploy: ${{ steps.changes.outputs.deploy }}
      sha: ${{ steps.commit.outputs.sha }}
      sites: ${{ steps.sites.outputs.matrix }}
    steps:
      - name: Resolve deployed commit
        id: commit
        env:
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.commit.outputs.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$changed"
          if printf '%s\n' "$changed" | grep -Eq '^(src/|sites/|profiles/|requirements/|pyproject\.toml$|\.github/workflows/deploy-pages\.yml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "No deployable paths changed; skipping deployment."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.changes.outputs.deploy == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install package
        if: steps.changes.outputs.deploy == 'true'
        run: |
          python -m pip install -r requirements/docs.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Configure Pages
        if: steps.changes.outputs.deploy == 'true'
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Resolve published site matrix
        if: steps.changes.outputs.deploy == 'true'
        id: sites
        run: echo "matrix=$(romwiki site list --published --json)" >> "$GITHUB_OUTPUT"

  build:
    if: needs.prepare.outputs.deploy == 'true'
    timeout-minutes: 20
    name: Build ${{ matrix.site.id }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        site: ${{ fromJSON(needs.prepare.outputs.sites) }}
    env:
      SITE_ID: ${{ matrix.site.id }}
      ROMWIKI_SITE_URL: ${{ needs.prepare.outputs.base_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install documentation dependencies
        run: |
          python -m pip install -r requirements/docs.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Restore snapshot download cache
        if: matrix.site.data_driven
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .romwiki/snapshot-cache
          key: snapshot-${{ matrix.site.id }}-${{ hashFiles('sites/generated-wiki/manifest.json') }}

      - name: Restore generated wiki pages
        if: matrix.site.data_driven
        run: romwiki site restore-snapshot --site "$SITE_ID"

      - name: Resolve site build fingerprint
        id: fingerprint
        run: echo "value=$(romwiki site fingerprint "$SITE_ID" --output dist)" >> "$GITHUB_OUTPUT"

      - name: Restore reusable site artifact
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            dist
            .romwiki/build-state
          key: site-${{ runner.os }}-${{ matrix.site.id }}-${{ steps.fingerprint.outputs.value }}

      - name: Build site
        run: romwiki site build "$SITE_ID" --output dist --reuse-unchanged

      - name: Upload site artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-${{ matrix.site.id }}
          path: dist
          if-no-files-found: error
          retention-days: 1

  publish:
    timeout-minutes: 15
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install package
        run: |
          python -m pip install -r requirements/docs.txt
          python -m pip install --no-deps --no-build-isolation .

      - name: Assemble site artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: site-*
          path: dist
          merge-multiple: true

      - name: Restore audit parse cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .romwiki/audit-cache.sqlite3
          key: audit-v1-${{ needs.prepare.outputs.sha }}
          restore-keys: audit-v1-

      - name: Audit rendered sites
        env:
          BASE_URL: ${{ needs.prepare.outputs.base_url }}
        run: romwiki site audit dist --base-url "$BASE_URL"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
