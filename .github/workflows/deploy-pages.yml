name: Deploy wikis to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.pages.outputs.base_url }}
      sites: ${{ steps.sites.outputs.matrix }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install test and documentation dependencies
        run: python -m pip install ".[dev,docs]"

      - name: Run tests
        run: python -m pytest -q

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Resolve published site matrix
        id: sites
        run: echo "matrix=$(romwiki site list --published --json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.site.id }}
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        site: ${{ fromJSON(needs.prepare.outputs.sites) }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install documentation dependencies
        run: python -m pip install ".[docs]"

      - name: Restore generated wiki pages
        if: matrix.site.data_driven
        run: romwiki site restore-snapshot

      - name: Build site
        run: romwiki site build "${{ matrix.site.id }}" --output dist
        env:
          ROMWIKI_SITE_URL: ${{ needs.prepare.outputs.base_url }}

      - name: Package site
        run: tar -czf "site-${{ matrix.site.id }}.tar.gz" -C dist .

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ matrix.site.id }}
          path: site-${{ matrix.site.id }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package
        run: python -m pip install .

      - name: Assemble site artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: artifacts
          merge-multiple: true

      - name: Extract site artifacts
        run: |
          mkdir -p dist
          for archive in artifacts/site-*.tar.gz; do
            tar -xzf "$archive" -C dist
          done

      - name: Audit rendered sites
        run: romwiki site audit dist --base-url "${{ needs.prepare.outputs.base_url }}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: publish
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
