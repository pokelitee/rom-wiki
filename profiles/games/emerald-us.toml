# `gRegionMapEntries`, one entry per region map section (0 = "LITTLEROOT
# TOWN" ... 212 = "TRAINER HILL"), and `gMapGroups` -- see
# engines/gen3/emerald/constants.py's REGION_NAME_* and
# GMAPGROUPS_GROUP_COUNT comments.
region_name_symbol = "gRegionMapEntries"
region_name_count = 213
gmapgroups_symbol = "gMapGroups"

# `gTrainerMoneyTable`: 4-byte (class, money value, padding) entries.
trainer_money_symbol = "gTrainerMoneyTable"

# `gMoveDescriptionPointers`: one pointer per move from move 1.
move_description_symbol = "gMoveDescriptionPointers"

# `gPokedexEntries`: one entry per National Dex number from 0.
pokedex_entry_symbol = "gPokedexEntries"

# Pickup's 18 common items, 11 rare items, and nine rate thresholds.
pickup_common_items_symbol = "sPickupItems"
pickup_rare_items_symbol = "sRarePickupItems"
pickup_common_rate_symbol = "sPickupProbabilities"

# `sStarterMon`: Treecko, Torchic, and Mudkip, indexed by VAR_STARTER_MON.
