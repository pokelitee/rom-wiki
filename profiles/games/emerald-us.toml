# The rematch table: 16-byte rows of trainer IDs.
rematch_table_symbol = "gRematchTable"
rematch_table_count = 78
trainer_variant_contract = "emerald-retail-v1"

# `sIngameTrades`: 4 in-game trades, 60 bytes each.
trade_table_symbol = "sIngameTrades"
trade_count = 4

# `gSpecials` handlers named by event scripts.
event_mon_special = "CreateEnemyEventMon"
trade_info_special = "GetInGameTradeSpeciesInfo"

