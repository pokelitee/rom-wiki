[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-wiki"
version = "0.1.0"
description = "Extract structured Pokémon ROM data and generate static wikis"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "zhenga8533" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

[project.optional-dependencies]
# capstone is an analysis-only tool: it is used to verify ROM code paths when
# decoding a new selector (it identified the starter accessor behind
# `starter_species_offset`). Nothing under src/ imports it at runtime.
dev = ["pytest>=8", "ruff==0.15.22", "capstone>=5,<6", "mypy==2.3.1"]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.6,<10",
    "mkdocs-minify-plugin>=0.8,<1",
    "watchdog>=6,<7",
]

[project.scripts]
romwiki = "romwiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = ".romwiki/pytest-cache"

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "C4", "C90", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

# Baseline for incremental adoption: these modules had pre-existing type
# errors when the CI gate was introduced. Newly written or touched code
# should be typed cleanly; shrink this list as each module is fixed rather
# than adding to it.
