[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-wiki"
version = "0.1.0"
description = "Extract structured Pokémon ROM data for a shared React reference app"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhenga8533" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://pokelitee.github.io/rom-wiki/"
Repository = "https://github.com/pokelitee/rom-wiki"
Documentation = "https://github.com/pokelitee/rom-wiki/tree/main/docs"
Issues = "https://github.com/pokelitee/rom-wiki/issues"

[project.optional-dependencies]
# capstone is an analysis-only tool: it is used to verify ROM code paths when
# decoding a new selector (it identified the starter accessor behind
# `starter_species_offset`). Nothing under src/ imports it at runtime.
dev = ["pytest>=8", "ruff==0.17.0", "capstone>=5,<6", "mypy==2.4.0"]

[project.scripts]
romwiki = "romwiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# pytest's defaults minus "build", which would otherwise skip tests/pipeline/build.
norecursedirs = ["*.egg", ".*", "_darcs", "CVS", "dist", "node_modules", "venv", "{arch}"]
addopts = "-ra"
cache_dir = ".romwiki/pytest-cache"

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "C4", "C90", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true

# Tests are type-checked too, with three relaxations: small helpers needn't
# be annotated (their bodies are still checked); test doubles -- SimpleNamespace
# fakes, partial dict fixtures, deliberately invalid values -- needn't match
# the full types they stand in for; and assertions may use an optional value
# directly, since an unexpected None fails the test anyway.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true
strict_optional = false
disable_error_code = ["arg-type", "typeddict-item", "dict-item", "list-item"]
