[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rom-wiki"
version = "0.1.0"
description = "Extract structured Pokémon ROM data and generate static wikis"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "zhenga8533" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment",
]

[project.urls]
Homepage = "https://pokelitee.github.io/rom-wiki/"
Repository = "https://github.com/pokelitee/rom-wiki"
Documentation = "https://github.com/pokelitee/rom-wiki/tree/main/docs"
Issues = "https://github.com/pokelitee/rom-wiki/issues"

[project.optional-dependencies]
# capstone is an analysis-only tool: it is used to verify ROM code paths when
# decoding a new selector (it identified the starter accessor behind
# `starter_species_offset`). Nothing under src/ imports it at runtime.
dev = ["pytest>=8", "ruff==0.15.22", "capstone>=5,<6", "mypy==2.3.1"]
docs = [
    "mkdocs>=1.6.1,<2",
    "mkdocs-material>=9.7.6,<10",
    "mkdocs-minify-plugin>=0.8,<1",
    "watchdog>=6,<7",
]

[project.scripts]
romwiki = "romwiki.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = ".romwiki/pytest-cache"

[tool.ruff.lint]
select = ["F", "I", "UP", "B", "C4", "C90", "SIM"]

[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
