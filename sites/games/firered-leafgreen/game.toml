[site]
id = "firered-leafgreen"
name = "Pokémon FireRed & LeafGreen"
kind = "game"
slug = "firered-leafgreen"
published = false
order = 40
mkdocs_config = "mkdocs.yml"
description = "A data-driven reference for Pokémon FireRed and LeafGreen (USA)"

[game]
profiles = ["firered-us", "leafgreen-us"]
versions = ["firered", "leafgreen"]
generation = 3
base_game = "firered-leafgreen"
platform = "game-boy-advance"
platform_name = "Game Boy Advance"
creator = "Game Freak"
# gen3_frlg is a vertical slice: only the Pokémon domain is implemented so
# far (see engines/registry.py's GEN3_FRLG_ENGINE entry). Restricted to what
# the profiles actually support -- "types"/"data" are always-available,
# non-dataset-kind sections, required for every data-driven site.
generated_sections = ["pokemon", "types", "data"]

[appearance]
# Placeholder: reusing the neutral "platinum" theme (already shared by two
# unrelated sites) until FireRed/LeafGreen gets its own designed palette --
# a real theme needs CSS work in sites/shared/overrides, out of scope here.
theme = "platinum"
