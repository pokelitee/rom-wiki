[site]
id = "emerald"
name = "Pokémon Emerald"
kind = "game"
slug = "emerald"
published = false
order = 50
mkdocs_config = "mkdocs.yml"
description = "A data-driven reference for Pokémon Emerald (USA, Europe)"

[game]
profile = "emerald-us"
generation = 3
base_game = "emerald"
platform = "game-boy-advance"
platform_name = "Game Boy Advance"
creator = "Game Freak"
# gen3_emerald is a vertical slice: Pokémon, moves, items, trainers,
# abilities, wild encounters, and locations are implemented so far (see
# engines/registry.py's GEN3_EMERALD_ENGINE entry). Battle Frontier and a
# handful of other Emerald-exclusive systems aren't covered yet. Restricted
# to what the profile actually supports -- "types"/"data" are always-
# available, non-dataset-kind sections, required for every data-driven site.
generated_sections = [
    "pokemon",
    "moves",
    "items",
    "trainers",
    "abilities",
    "encounters",
    "locations",
    "types",
    "data",
]

[appearance]
# Placeholder: reusing the neutral "platinum" theme (already shared by
# several unrelated sites) until Emerald gets its own designed palette -- a
# real theme needs CSS work in sites/shared/overrides, out of scope here.
theme = "platinum"
