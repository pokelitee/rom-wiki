repo_url: https://github.com/zhenga8533/rom-wiki
repo_name: zhenga8533/rom-wiki

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Use dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Use light mode

plugins:
  - search
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true

markdown_extensions:
  - attr_list
  - md_in_html
  - tables
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

extra:
  generator: false

# Generated detail pages are intentionally reached through searchable catalogs
# rather than the global navigation. Declaring them here avoids thousands of
# expected omitted-navigation messages during production builds.
not_in_nav: |
  /pokemon/*.md
  /abilities/*.md
  /items/*.md
  /moves/*.md
  /encounters/*.md
  /trainers/*.md
  /locations/*.md
  /changes/*.md
  /data/*.md
